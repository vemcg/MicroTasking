name: Build & release APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine timestamped version/tag
        id: version
        run: |
          BUILD_TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          VERSION_NAME="0.1.6-${BUILD_TIMESTAMP}"
          VERSION_CODE=$(date -u +%s)
          TAG="v${VERSION_NAME}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset_name=MicroTasking-$TAG.apk" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug -PbuildVersionName="${{ steps.version.outputs.version_name }}" -PbuildVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${{ steps.version.outputs.asset_name }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MicroTasking ${{ steps.version.outputs.tag }}"
          files: dist/${{ steps.version.outputs.asset_name }}

      - name: Install QR code generator
        run: pip install --quiet "qrcode[pil]"

      - name: Generate install page + QR code
        run: |
          python scripts/generate_install_page.py \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.version.outputs.asset_name }}" \
            --version "${{ steps.version.outputs.tag }}" \
            --template-url "https://docs.google.com/spreadsheets/d/1Ss15J7afOl3HON6h2dI8f8hGi8JYjH0hRywuV0nCYOg/edit?usp=sharing" \
            --out docs

      - name: Deploy install page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: gh-pages
