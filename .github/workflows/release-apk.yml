name: Build & release APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine timestamped version/tag
        id: version
        run: |
          BUILD_TIMESTAMP=$(date -u +%Y%m%d.%H%M%S)
          SHORT_SHA=$(git rev-parse --short=7 "$GITHUB_SHA")
          VERSION_BASE="0.1.7"
          BUILD_NUMBER="${{ github.run_number }}"
          VERSION_NAME="${VERSION_BASE}-${BUILD_NUMBER}"
          VERSION_CODE=$(date -u +%s)
          BRANCH="${GITHUB_REF_NAME}"
          # Tag and asset name are the same short "vBASE-N" shape for every branch, dev included -
          # BUILD_NUMBER is github.run_number, unique repo-wide, so no two builds (any branch) ever
          # collide. Every build gets its own permanent versioned release and URL, e.g.
          # MicroTasking-v0.1.7-50.apk at .../releases/download/v0.1.7-50/MicroTasking-v0.1.7-50.apk.
          # Branch identity lives only in the release *title* (GitHub's own bookkeeping), the
          # onboarding page's QR label, and the app's About section - not in the tag/filename/URL.
          # Dev builds additionally delete the previous dev release (see "Remove previous dev
          # releases") so GitHub keeps only the newest; main releases are permanent history.
          DISPLAY_VERSION="v${VERSION_NAME}"
          TAG="$DISPLAY_VERSION"
          ASSET_NAME="MicroTasking-$TAG.apk"
          if [ "$BRANCH" = "main" ]; then
            RELEASE_NAME="MicroTasking $DISPLAY_VERSION"
          else
            SAFE_BRANCH=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
            RELEASE_NAME="MicroTasking $DISPLAY_VERSION ($SAFE_BRANCH)"
          fi
          echo "version_base=$VERSION_BASE" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "git_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "git_branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            -PbuildVersionBase="${{ steps.version.outputs.version_base }}" \
            -PbuildNumber="${{ steps.version.outputs.build_number }}" \
            -PbuildTimestamp="${{ steps.version.outputs.build_timestamp }}" \
            -PbuildGitSha="${{ steps.version.outputs.git_sha }}" \
            -PbuildGitBranch="${{ steps.version.outputs.git_branch }}" \
            -PbuildVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${{ steps.version.outputs.asset_name }}"

      - name: Remove previous dev releases (only the newest is kept)
        # Dev builds now get their own incrementing "vBASE-N" tag (see "Determine timestamped
        # version/tag"), so there's no fixed tag to overwrite. Instead, before publishing this
        # build's release, delete every existing dev release - identified by the " (branch)"
        # suffix every non-main release title carries and a main title never does - so exactly
        # one dev release is ever live on GitHub: the newest. Main's releases match neither
        # pattern and are left untouched. continue-on-error covers the first-ever dev build.
        if: steps.version.outputs.git_branch != 'main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,name \
            | jq -r '.[] | select(.name | test("^MicroTasking v[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+ \\(")) | .tagName' \
            | while read -r old_tag; do
                echo "Deleting superseded dev release: $old_tag"
                gh release delete "$old_tag" --yes --cleanup-tag
              done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          files: dist/${{ steps.version.outputs.asset_name }}

      - name: Find latest main release
        id: mainrelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAIN_TAG=""
          if [ "${{ steps.version.outputs.git_branch }}" != "main" ]; then
            # Every branch's tag is the same "vBASE-N" shape (see "Determine timestamped
            # version/tag"), so main can't be told apart by tag - this keys off the release
            # *title* instead ("MicroTasking vBASE-N" for main, with a "(branch)" suffix for
            # everything else). publishedAt, not createdAt: createdAt tracks the tagged commit's
            # date, which several releases built from the same commit window share - it can't tell
            # them apart. publishedAt is the actual release-publish moment, always distinct.
            MAIN_TAG=$(gh release list --limit 50 --json tagName,name,publishedAt \
              | jq -r '[.[] | select(.name | test("^MicroTasking v[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+$"))] | sort_by(.publishedAt) | last | .tagName // empty')
          fi
          echo "main_tag=$MAIN_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$MAIN_TAG" ]; then
            echo "main_url=https://github.com/${{ github.repository }}/releases/download/$MAIN_TAG/MicroTasking-$MAIN_TAG.apk" >> "$GITHUB_OUTPUT"
          else
            echo "main_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install QR code generator
        run: pip install --quiet "qrcode[pil]"

      - name: Generate install page + QR code
        run: |
          python scripts/generate_install_page.py \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.version.outputs.asset_name }}" \
            --version "${{ steps.version.outputs.display_version }}" \
            --branch "${{ steps.version.outputs.git_branch }}" \
            --main-url "${{ steps.mainrelease.outputs.main_url }}" \
            --main-version "${{ steps.mainrelease.outputs.main_tag }}" \
            --template-url "https://docs.google.com/spreadsheets/d/1YZNQxZlzj8Xj4Bya2v8YEiq01n6jseD3JZSr7BlThJo/edit?usp=sharing" \
            --out docs

      - name: Deploy install page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: gh-pages
