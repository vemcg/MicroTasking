org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Kotlin 1.9.24's bundled IntelliJ storage can't parse a Java 25 version string ("25.0.2"),
# which crashes the incremental compiler's CachingLazyStorage. The only JDKs on this machine
# are Java 25, so disable incremental Kotlin compilation until the Kotlin/AGP versions are bumped.
kotlin.incremental=false
